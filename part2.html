<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Assignment - 4</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

  <nav class="navbar navbar-expand-lg navbar-dark bg-dark mb-4">
    <div class="container">
      <a class="navbar-brand" href="#">Assignment 4</a>
      <div class="navbar-nav">
        <a class="nav-link" href="index.html">Part 1 HTML5</a>
        <a class="nav-link active" href="part2.html">Part 2 Bootstrap</a>
        <a class="nav-link" href="part3.html">Part 3 Registration</a>
      </div>
    </div>
  </nav>

  <div class="container py-3">
    <h2>Rizabek Begen</h2>
    <p class="text-muted">SE-2529</p>
    <hr>
    <h3 class="mb-4">Part 2: Bootstrap Form & Validation</h3>

    <div class="card shadow-sm p-4">
      
      <form class="needs-validation" novalidate action="#" method="POST">
        <div class="row g-3">
          
          <div class="col-md-6">
            <label for="userName" class="form-label">Name</label>
            <input type="text" class="form-control" id="userName" name="userName" placeholder="For example: Rizabek Begen" required minlength="2">
            <div class="valid-feedback">Looks good!</div>
            <div class="invalid-feedback">Please enter your name (min 2 characters).</div>
          </div>

          <div class="col-md-6">
            <label for="userEmail" class="form-label">Email address</label>
            <input type="email" class="form-control" id="userEmail" name="userEmail" placeholder="example@mail.com" required>
            <div class="valid-feedback">Looks good!</div>
            <div class="invalid-feedback">Please provide a valid email address.</div>
          </div>

          <div class="col-12">
            <label for="userMessage" class="form-label">Message</label>
            <textarea class="form-control" id="userMessage" name="userMessage" rows="4" placeholder="Write your message here..." required minlength="7"></textarea>
            <div class="valid-feedback">Looks good!</div>
            <div class="invalid-feedback">Please enter a message (at least 7 characters).</div>
          </div>

          <div class="col-12">
            <button class="btn btn-primary" type="submit">Submit Form</button>
          </div>

        </div>
      </form>
    </div>
  </div>

  <script>
    const forms = document.querySelectorAll('.needs-validation');

    Array.from(forms).forEach(form => {
      form.addEventListener('submit', event => {
        if (!form.checkValidity()) {
          event.preventDefault();
          event.stopPropagation();
        }

        form.classList.add('was-validated');
      }, false);
    });
  </script>

</body>
</html>
