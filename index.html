    <h3>Part 1: Basic HTML Form & Validation</h3>

    <form action="#" method="POST" class="mt-4">
      
      <div class="mb-3">
        <label for="userName">Name:</label><br>
        <input type="text" id="userName" name="userName" required minlength="2" maxlength="50">
      </div>

      <div class="mb-3">
        <label for="userEmail">Email:</label><br>
        <input type="email" id="userEmail" name="userEmail" placeholder="example@mail.com" required>
      </div>

      <div class="mb-3">
        <label for="userMessage">Message:</label><br>
        <textarea id="userMessage" name="userMessage" rows="4" required minlength="7"></textarea>
      </div>

      <button type="submit" class="btn btn-primary">Submit Form</button>

    </form>
  </div>
